name: Build Gold Slots Player 6.9.3 Original Visual V2

on:
  push:
    branches: [release/goldslots-player-6.9.3-original-visual]
    paths:
      - 'goldslots-player-693/**'
      - '.github/workflows/build-goldslots-player-693-original-visual-v2.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'goldslots-player-693/**'
      - '.github/workflows/build-goldslots-player-693-original-visual-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goldslots-player-693-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-visual-windows-release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: goldslots-player-693
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund

      - name: Download and checksum original artwork installer
        run: npm run download:base

      - name: Extract original artwork runtime from NSIS payload
        shell: pwsh
        run: ./scripts/extract-base.ps1

      - name: Patch original app without replacing its design
        env:
          BASE_INSTALL_DIR: 'C:\GSP680BASE'
        run: npm run patch:base

      - name: Validate original logo artwork controls and responsive release code
        shell: pwsh
        run: |
          node --check work/app-extracted/main.js
          node --check work/app-extracted/preload.js
          node --check work/app-extracted/dist/renderer.js
          node --check work/app-extracted/dist/manual-693.js
          node --check work/app-extracted/dist/release-693.js
          $index=Get-Content 'work/app-extracted/dist/index.html' -Raw
          foreach($required in @('goldslots-brand.css','public-release.css','casino-premium-3d.css','manual-693.css','release-693.css','manual-693.js','release-693.js','goldslots-logo.svg')){if($index -notmatch [regex]::Escape($required)){throw "Missing original visual reference: $required"}}
          $games=@('lucky-reels','five-card-poker','jacks-or-better','blackjack-21','keno','roulette','money-wheel','bingo','hi-lo-cards','baccarat','craps')
          foreach($game in $games){
            foreach($folder in @('game-menu','game-screens')){
              $asset="work/app-extracted/assets/$folder/$game.webp"
              if(!(Test-Path $asset) -or (Get-Item $asset).Length -lt 8000){throw "Missing original artwork: $folder/$game.webp"}
            }
          }
          if((Get-ChildItem work/prepackaged -Recurse -File -Filter '*.ps1').Count){throw 'PowerShell runtime file detected.'}
          $manual=Get-Content 'work/app-extracted/dist/manual-693.js' -Raw
          foreach($token in @('BLACKJACK_HIT','BLACKJACK_STAND','POKER_DEAL','POKER_DRAW','hiLoPick','manual.betSelected')){if($manual -notmatch [regex]::Escape($token)){throw "Manual game control missing: $token"}}
          if($manual -match 'dispatchEvent\s*\(|new\s+MouseEvent'){throw 'Automatic or repeated synthetic gameplay clicks are not allowed.'}
          $release=Get-Content 'work/app-extracted/dist/release-693.js' -Raw
          foreach($token in @('pointerdown','event.isTrusted','elementsFromPoint','control.click()','stopImmediatePropagation')){if($release -notmatch [regex]::Escape($token)){throw "Physical pointer bridge missing: $token"}}
          $css=Get-Content 'work/app-extracted/dist/release-693.css' -Raw
          foreach($token in @('--gs-cols','--gs-rows','game-grid','goldslots-logo.svg','orientation:portrait')){if($css -notmatch [regex]::Escape($token)){throw "Responsive visual rule missing: $token"}}

      - name: Generate proof from the exact packaged original artwork
        run: node scripts/make-artwork-proof.cjs

      - name: Launch prepackaged Player on Windows
        shell: pwsh
        env:
          GS_PLAYER_UI_TEST: '1'
        run: |
          $ErrorActionPreference='Stop'
          $appExe=Join-Path $env:GITHUB_WORKSPACE 'goldslots-player-693\work\prepackaged\Gold Slots Player.exe'
          if(!(Test-Path $appExe)){throw 'Prepackaged Player executable is missing.'}
          $process=Start-Process -FilePath $appExe -ArgumentList '--disable-gpu' -PassThru
          Start-Sleep -Seconds 10
          if($process.HasExited){throw "Prepackaged Player exited during Windows smoke launch: $($process.ExitCode)"}
          Stop-Process -Id $process.Id -Force
          @'
          Prepackaged Windows launch passed.
          Original logo and all eleven lobby/game artwork files were validated before launch.
          Physical pointer bridge and strict manual controls passed static production checks.
          '@ | Out-File 'visual-proof/PREPACKAGED-WINDOWS-LAUNCH-PASS.txt' -Encoding utf8

      - name: Build proper assisted NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Install launch and uninstall final Player EXE
        timeout-minutes: 20
        shell: pwsh
        env:
          GS_PLAYER_UI_TEST: '1'
        run: |
          $ErrorActionPreference='Stop'
          $installer=Resolve-Path 'release/GoldSlots-Player-Setup-6.9.3.exe'
          if((Get-Item $installer).Length -lt 70000000){throw 'Installer does not contain the full original artwork package.'}
          & 7z l $installer | Out-File 'release/INSTALLER-CONTENTS.txt' -Encoding utf8
          if($LASTEXITCODE -ne 0){throw 'Final EXE is not a readable NSIS installer.'}
          $installDir='C:\GSP693QA'
          if(Test-Path $installDir){Remove-Item $installDir -Recurse -Force}
          $install=Start-Process -FilePath $installer -ArgumentList '/S',('/D='+$installDir) -Wait -PassThru
          if($install.ExitCode -ne 0){throw "Final installer failed: $($install.ExitCode)"}
          $appExe=Join-Path $installDir 'Gold Slots Player.exe'
          $appAsar=Join-Path $installDir 'resources\app.asar'
          if(!(Test-Path $appExe) -or !(Test-Path $appAsar)){throw 'Installed Player runtime is incomplete.'}
          if((Get-ChildItem $installDir -Recurse -File -Filter '*.ps1').Count){throw 'Installed Player contains PowerShell runtime files.'}
          $process=Start-Process -FilePath $appExe -ArgumentList '--disable-gpu' -PassThru
          Start-Sleep -Seconds 10
          if($process.HasExited){throw "Installed Player exited during Windows smoke launch: $($process.ExitCode)"}
          Stop-Process -Id $process.Id -Force
          $shortcut=@((Join-Path $env:PUBLIC 'Desktop\Gold Slots Player.lnk'),(Join-Path ([Environment]::GetFolderPath('Desktop')) 'Gold Slots Player.lnk'))|Where-Object{Test-Path $_}|Select-Object -First 1
          if(-not $shortcut){throw 'Desktop shortcut is missing.'}
          $uninstaller=Get-ChildItem $installDir -File|Where-Object{$_.Name -match '^Uninstall.*\.exe$'}|Select-Object -First 1
          if(-not $uninstaller){throw 'Windows uninstaller is missing.'}
          $sha256=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha512=(Get-FileHash $installer -Algorithm SHA512).Hash.ToLowerInvariant()
          $size=(Get-Item $installer).Length
          "SHA256=$sha256"|Out-File 'release/SHA256.txt' -Encoding ascii
          "SHA512=$sha512"|Out-File 'release/SHA512.txt' -Encoding ascii
          "SIZE=$size"|Out-File 'release/SIZE.txt' -Encoding ascii
          @'
          GOLD SLOTS PLAYER 6.9.3 — ORIGINAL PREMIUM VISUAL RELEASE

          Windows release validation completed:
          - Original Gold Slots logo retained.
          - All eleven original lobby card artworks retained.
          - All eleven original game-screen artworks retained.
          - Premium brand, public-release and casino 3D styles retained.
          - Responsive landscape, short-screen and portrait rules packaged.
          - One-action trusted physical-pointer bridge packaged for Player controls.
          - Strict manual stake and game decisions packaged.
          - Blackjack Deal/Hit/Stand and Poker Deal/Hold/Draw code validated.
          - Normal non-kiosk startup packaged.
          - No PowerShell runtime files packaged.
          - NSIS installation, Windows launch, shortcut and uninstaller verified.
          '@|Out-File 'release/README.txt' -Encoding utf8
          $uninstall=Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if($uninstall.ExitCode -ne 0){throw "Uninstaller failed: $($uninstall.ExitCode)"}
          Start-Sleep -Seconds 3
          if(Test-Path $appExe){throw 'Uninstaller did not remove the Player executable.'}

      - name: Upload proof and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldSlots-Player-6.9.3-Original-Visual-Proof-V2
          path: |
            goldslots-player-693/visual-proof/**
            goldslots-player-693/work/*.txt
            goldslots-player-693/work/*.json
            goldslots-player-693/release/*.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoldSlots-Player-6.9.3-Original-Visual-Installer
          path: |
            goldslots-player-693/release/GoldSlots-Player-Setup-6.9.3.exe
            goldslots-player-693/release/SHA256.txt
            goldslots-player-693/release/SHA512.txt
            goldslots-player-693/release/SIZE.txt
            goldslots-player-693/release/README.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
