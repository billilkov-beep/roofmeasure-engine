name: Build Gold Slots Player 6.9.3 Original Visual Release

on:
  push:
    branches:
      - release/goldslots-player-6.9.3-original-visual
    paths:
      - 'goldslots-player-693/**'
      - '.github/workflows/build-goldslots-player-693-original-visual.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'goldslots-player-693/**'
      - '.github/workflows/build-goldslots-player-693-original-visual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-install-visual-test:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: goldslots-player-693
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build and visual-test dependencies
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund

      - name: Download verified original visual Player base
        shell: pwsh
        run: npm run download:base

      - name: Install original visual base into isolated directory
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $baseInstaller=Resolve-Path 'work/GoldSlots-Player-Setup-6.8.0-Original-Visual.exe'
          $baseDir='C:\GSP680BASE'
          if(Test-Path $baseDir){Remove-Item $baseDir -Recurse -Force}
          $process=Start-Process -FilePath $baseInstaller -ArgumentList '/S',('/D='+$baseDir) -Wait -PassThru
          if($process.ExitCode -ne 0){throw "Original visual base installer failed with exit code $($process.ExitCode)."}
          if(-not(Test-Path (Join-Path $baseDir 'Gold Slots Player.exe'))){throw 'Original Player executable was not installed.'}
          if(-not(Test-Path (Join-Path $baseDir 'resources\app.asar'))){throw 'Original Player app.asar was not installed.'}

      - name: Preserve original design and apply native-click manual release layer
        shell: pwsh
        env:
          BASE_INSTALL_DIR: 'C:\GSP680BASE'
        run: npm run patch:base

      - name: Static original-visual production checks
        shell: pwsh
        run: |
          node --check work/app-extracted/main.js
          node --check work/app-extracted/preload.js
          node --check work/app-extracted/dist/renderer.js
          node --check work/app-extracted/dist/manual-693.js
          node --check work/app-extracted/dist/release-693.js
          $index=Get-Content 'work/app-extracted/dist/index.html' -Raw
          foreach($required in @('goldslots-brand.css','public-release.css','casino-premium-3d.css','manual-693.css','release-693.css','goldslots-logo.svg')){if($index -notmatch [regex]::Escape($required)){throw "Missing original visual reference: $required"}}
          $approved=@('lucky-reels','five-card-poker','jacks-or-better','blackjack-21','keno','roulette','money-wheel','bingo','hi-lo-cards','baccarat','craps')
          foreach($game in $approved){
            $menu="work/app-extracted/assets/game-menu/$game.webp"
            $screen="work/app-extracted/assets/game-screens/$game.webp"
            if(!(Test-Path $menu) -or (Get-Item $menu).Length -lt 8000){throw "Missing original lobby artwork: $game"}
            if(!(Test-Path $screen) -or (Get-Item $screen).Length -lt 8000){throw "Missing original game-screen artwork: $game"}
          }
          if((Get-ChildItem 'work/prepackaged' -Recurse -File -Filter '*.ps1').Count -gt 0){throw 'PowerShell file found in prepared Player.'}
          $manual=Get-Content 'work/app-extracted/dist/manual-693.js' -Raw
          if($manual -notmatch 'BLACKJACK_HIT' -or $manual -notmatch 'BLACKJACK_STAND'){throw 'Manual Blackjack flow missing.'}
          if($manual -notmatch 'POKER_DEAL' -or $manual -notmatch 'POKER_DRAW'){throw 'Manual Poker flow missing.'}
          if($manual -match 'dispatchEvent\s*\(|new\s+MouseEvent'){throw 'Synthetic click rescue code is not allowed.'}

      - name: Launch original prepackaged app and run screenshot/native-click tests
        shell: pwsh
        env:
          GS_PLAYER_EXE: 'D:\a\roofmeasure-engine\roofmeasure-engine\goldslots-player-693\work\prepackaged\Gold Slots Player.exe'
          GS_TEST_LABEL: 'prepackaged'
          GS_PLAYER_UI_TEST: '1'
        run: npm run test:visual

      - name: Build assisted NSIS installer from tested original runtime
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Install final EXE and repeat visual/native-click tests
        shell: pwsh
        env:
          GS_PLAYER_UI_TEST: '1'
        run: |
          $ErrorActionPreference='Stop'
          $installer=Resolve-Path 'release/GoldSlots-Player-Setup-6.9.3.exe'
          if((Get-Item $installer).Length -lt 70000000){throw 'Final installer is too small to contain the original artwork package.'}
          & 7z l $installer | Out-File 'release/INSTALLER-CONTENTS.txt' -Encoding utf8
          if($LASTEXITCODE -ne 0){throw 'Final EXE is not a readable NSIS installer.'}
          $installDir='C:\GSP693QA'
          if(Test-Path $installDir){Remove-Item $installDir -Recurse -Force}
          $install=Start-Process -FilePath $installer -ArgumentList '/S',('/D='+$installDir) -Wait -PassThru
          if($install.ExitCode -ne 0){throw "Final installer failed with exit code $($install.ExitCode)."}
          $appExe=Join-Path $installDir 'Gold Slots Player.exe'
          $appAsar=Join-Path $installDir 'resources\app.asar'
          if(!(Test-Path $appExe) -or !(Test-Path $appAsar)){throw 'Final installed Player runtime is incomplete.'}
          if((Get-ChildItem $installDir -Recurse -File -Filter '*.ps1').Count -gt 0){throw 'Installed Player contains a PowerShell file.'}
          $env:GS_PLAYER_EXE=$appExe
          $env:GS_TEST_LABEL='installed'
          npm run test:visual
          Remove-Item Env:GS_PLAYER_EXE -ErrorAction SilentlyContinue
          Remove-Item Env:GS_TEST_LABEL -ErrorAction SilentlyContinue

          $shortcutCandidates=@((Join-Path $env:PUBLIC 'Desktop\Gold Slots Player.lnk'),(Join-Path ([Environment]::GetFolderPath('Desktop')) 'Gold Slots Player.lnk'))|Select-Object -Unique
          if(-not($shortcutCandidates|Where-Object{Test-Path $_}|Select-Object -First 1)){throw 'Desktop shortcut was not created.'}
          $uninstaller=Get-ChildItem $installDir -File|Where-Object{$_.Name -match '^Uninstall.*\.exe$'}|Select-Object -First 1
          if(-not $uninstaller){throw 'Windows uninstaller is missing.'}
          $uninstall=Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if($uninstall.ExitCode -ne 0){throw "Uninstaller failed with exit code $($uninstall.ExitCode)."}
          Start-Sleep -Seconds 3
          if(Test-Path $appExe){throw 'Uninstaller did not remove the final executable.'}

          $sha256=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha512=(Get-FileHash $installer -Algorithm SHA512).Hash.ToLowerInvariant()
          $size=(Get-Item $installer).Length
          "SHA256=$sha256"|Out-File 'release/SHA256.txt' -Encoding ascii
          "SHA512=$sha512"|Out-File 'release/SHA512.txt' -Encoding ascii
          "SIZE=$size"|Out-File 'release/SIZE.txt' -Encoding ascii
          @'
          GOLD SLOTS PLAYER 6.9.3 — ORIGINAL PREMIUM VISUAL RELEASE

          Windows automated validation completed before publication:
          - Original Gold Slots logo rendered and screenshot-verified.
          - All eleven original lobby WEBP artworks loaded with real image dimensions.
          - Original premium brand, public-release and casino 3D styles remained active.
          - Original game stages opened through native mouse clicks for all eleven games.
          - Lobby screenshots validated at 1024x576, 1366x768, 1920x1080 and 800x1000 portrait.
          - Screenshot pixel variance checks rejected blank, flat or vanished designs.
          - Hi-Lo required manual stake plus Higher/Lower.
          - Blackjack tested Deal and manual Hit/Stand interaction.
          - Jacks or Better tested Deal, Hold and Draw interaction.
          - Original sound mixer opened, changed and closed.
          - Normal non-kiosk startup verified; fresh Super Admin policy remains authoritative.
          - No synthetic mouse forwarding, PowerShell runtime or .ps1 files.
          - Assisted NSIS install, desktop shortcut and uninstaller verified.
          '@|Out-File 'release/README.txt' -Encoding utf8

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldSlots-Player-6.9.3-Visual-Proof
          path: |
            goldslots-player-693/visual-proof/**
            goldslots-player-693/work/PATCH-SUMMARY.json
            goldslots-player-693/work/BASE-SHA256.txt
            goldslots-player-693/release/*.txt
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

      - name: Upload verified installer artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoldSlots-Player-6.9.3-Original-Visual-Installer
          path: |
            goldslots-player-693/release/GoldSlots-Player-Setup-6.9.3.exe
            goldslots-player-693/release/SHA256.txt
            goldslots-player-693/release/SHA512.txt
            goldslots-player-693/release/SIZE.txt
            goldslots-player-693/release/README.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish only after every installed visual test passes
        if: success() && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='goldslots-player-v6.9.3-original-visual'
          $files=@('release/GoldSlots-Player-Setup-6.9.3.exe','release/SHA256.txt','release/SHA512.txt','release/SIZE.txt','release/README.txt')
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){
            gh release upload $tag @files --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title 'Gold Slots Player 6.9.3 Original Premium Visual Installer' --notes 'Published only after original logo/artwork screenshot validation, native clicks, responsive layouts, manual game flows, clean installation and uninstallation passed on Windows.'
          }else{
            gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Gold Slots Player 6.9.3 Original Premium Visual Installer' --notes 'Published only after original logo/artwork screenshot validation, native clicks, responsive layouts, manual game flows, clean installation and uninstallation passed on Windows.'
          }
